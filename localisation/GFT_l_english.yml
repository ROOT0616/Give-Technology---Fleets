l_english:
 edict_gft_technology_trade_options_menu:0 "Give Technology"
 edict_gft_technology_trade_options_menu_desc:0 "Offer an eligible technology you own as an immediate, free gift. The recipient may decline."
 edict_gft_fleet_trade_options_menu:0 "Give Fleet"
 edict_gft_fleet_trade_options_menu_desc:0 "Offer a military fleet as a permanent, free gift. Shared political fleets are excluded conservatively; see README."
 gft_country_title:0 "Choose a recipient"
 gft_country_desc:0 "Choose a contacted regular empire at peace with you. Up to 13 random candidates are shown. Refresh to draw again. No payment is collected."
 gft_tech_title:0 "Choose a technology field and tier"
 gft_tech_desc:0 "Only technologies you own and the recipient lacks are shown, with recipient eligibility and prerequisites satisfied. Empty pages can be skipped. Repeatable, starting and special event technologies are excluded."
 gft_fleet_title:0 "Choose a fleet"
 gft_fleet_desc:0 "Up to 10 mobile, unleased military fleets outside combat are shown. Federation presidents, the Custodian and the Emperor cannot send fleets in this beta. An assigned commander stays with the donor. The recipient may refuse."
 gft_fleet_offer_title:0 "A permanent fleet gift"
 gft_offer_tech_desc:0 "[gft_donor.GetName] offers the technology shown above, free of charge. Acceptance grants it immediately. Eligibility is checked again on acceptance."
 gft_offer_fleet_desc:0 "[gft_donor.GetName] offers permanent ownership of [gft_offered_fleet.GetName], free of charge. The fleet must still belong to the donor and be eligible when you accept."
 gft_accepted:0 "Gift accepted"
 gft_declined:0 "Gift declined"
 gft_tech_accepted_desc:0 "Your technology gift was accepted."
 gft_fleet_accepted_desc:0 "Your fleet gift was accepted. Ownership and control have been transferred."
 gft_declined_desc:0 "The recipient declined your offer, or the gift was no longer eligible."
