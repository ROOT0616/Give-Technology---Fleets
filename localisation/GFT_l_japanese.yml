l_japanese:
 edict_gft_technology_trade_options_menu:0 "技術の贈与"
 edict_gft_technology_trade_options_menu_desc:0 "自国が保有する対象技術を無償で贈与します。相手国は拒否できます。"
 edict_gft_fleet_trade_options_menu:0 "艦隊の贈与"
 edict_gft_fleet_trade_options_menu_desc:0 "軍事艦隊の所有権を無償で恒久移転します。共有艦隊保護のための制限はREADMEを参照してください。"
 gft_country_title:0 "贈与先の選択"
 gft_country_desc:0 "通信確立済みで交戦していない通常帝国から選択してください。候補はランダムに最大13か国です。「候補を再抽選」で入れ替えられます。対価は徴収されません。"
 gft_tech_title:0 "技術分野・ティアの選択"
 gft_tech_desc:0 "自国が保有し、相手国が未保有で、前提技術と受領条件を満たす技術を表示します。空のページは次へ進めてください。反復技術・開始時の技術・イベント用の特殊技術は対象外です。"
 gft_fleet_title:0 "贈与する艦隊の選択"
 gft_fleet_desc:0 "移動可能・貸与中ではない・戦闘中ではない軍事艦隊から最大10個を表示します。このベータ版では連邦議長・銀河守護者・銀河皇帝からの送付を制限しています。配属司令官は贈与元に残ります。相手国は拒否できます。"
 gft_fleet_offer_title:0 "艦隊の恒久贈与の申し出"
 gft_offer_tech_desc:0 "[gft_donor.GetName]から、上記の技術を無償で贈与する申し出がありました。受諾すると即時に取得します。受諾時に条件を再確認します。"
 gft_offer_fleet_desc:0 "[gft_donor.GetName]から[gft_offered_fleet.GetName]の所有権を無償で恒久移転する申し出がありました。受諾時にも贈与元の所有であり、移転条件を満たす必要があります。"
 gft_accepted:0 "贈与が受諾された"
 gft_declined:0 "贈与が成立しなかった"
 gft_tech_accepted_desc:0 "技術の贈与が受諾されました。"
 gft_fleet_accepted_desc:0 "艦隊の贈与が受諾され、所有権と制御権が移転しました。"
 gft_declined_desc:0 "相手国が拒否したか、贈与の条件を満たさなくなりました。"
 gft_accept:0 "贈与を受け入れる"
 gft_decline:0 "辞退する／無効な申し出を閉じる"
 gft_previous:0 "前のページ"
 gft_next:0 "次のページ"
 gft_refresh:0 "候補を再抽選"
 gft_back:0 "戻る"
 gft_close:0 "閉じる"
