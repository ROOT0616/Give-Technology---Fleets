l_simp_chinese:
 edict_gft_technology_trade_options_menu:0 "赠送科技"
 edict_gft_technology_trade_options_menu_desc:0 "无偿赠送已掌握的适用科技。接收方可以拒绝。"
 edict_gft_fleet_trade_options_menu:0 "赠送舰队"
 edict_gft_fleet_trade_options_menu_desc:0 "无偿永久转让军事舰队。为保护共享舰队而设置的限制请参阅README。"
 gft_country_title:0 "选择接收方"
 gft_country_desc:0 "选择已建立通讯且未与你交战的常规帝国。随机显示最多13个候选，可刷新。不收取任何费用。"
 gft_tech_title:0 "选择科技领域与等级"
 gft_tech_desc:0 "仅显示本国已掌握、对方未掌握且满足前置科技及接收条件的科技。空页可跳过。排除循环科技、初始科技及事件专用科技。"
 gft_fleet_title:0 "选择舰队"
 gft_fleet_desc:0 "最多显示10支可移动、非租借且未在战斗中的军事舰队。此测试版禁止联邦主席、银河监管人和银河皇帝赠送舰队。指挥官留在赠送方。接收方可以拒绝。"
 gft_fleet_offer_title:0 "永久赠送舰队的提议"
 gft_offer_tech_desc:0 "[gft_donor.GetName]愿意无偿赠送上方所示科技。接受后立即获得科技。接受时将再次检查条件。"
 gft_offer_fleet_desc:0 "[gft_donor.GetName]愿意无偿永久转让[gft_offered_fleet.GetName]。接受时该舰队必须仍归赠送方所有且符合条件。"
 gft_accepted:0 "赠送已被接受"
 gft_declined:0 "赠送未能完成"
 gft_tech_accepted_desc:0 "对方接受了你赠送的科技。"
 gft_fleet_accepted_desc:0 "对方接受了你赠送的舰队。所有权和控制权已转移。"
 gft_declined_desc:0 "对方拒绝了提议，或赠送条件已不再满足。"
 gft_accept:0 "接受赠送"
 gft_decline:0 "拒绝／关闭无效提议"
 gft_previous:0 "上一页"
 gft_next:0 "下一页"
 gft_refresh:0 "刷新候选"
 gft_back:0 "返回"
 gft_close:0 "关闭"
